[project]
name = "market-partition"
version = "0.1.1"
description = "Geographic market partitioning tool using OSM data — split regions by ring roads, main roads, rivers."
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# app/ 与数据管线层的重依赖（几何核心 market_partition.geometry 只需 shapely）
app = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "folium>=0.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyrosm>=0.11",
    "momepy>=1.0",
    "matplotlib>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_partition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
